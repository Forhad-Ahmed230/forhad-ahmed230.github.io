<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GravityLab</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 redirect hack
      // URL থেকে পাথ বের করে কুয়েরি প্যারামিটার হিসেবে index.html এ পাঠায়
      var pathSegmentsToKeep = 0; // যদি কাস্টম ডোমেইন থাকে তাহলে 0, অন্যথায় রিপোজিটরি নেম থাকলে 0 বা 1

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
